# Site Apache pour Laravel (utilisé par le Dockerfile)
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Journaux visibles dans l'onglet « Logs » de Render
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
